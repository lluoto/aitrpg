services:
  trpg:
    build: .
    ports:
      - "3099:3099"
    environment:
      - PORT=3099
      - NODE_ENV=production
      # LLM 凭据从宿主环境或 .env 传入，不烘进镜像。
      # 缺失时服务照常起，但叙事会退化成本地兜底的短句。
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      # 会话存档、模组 JSON、SQLite 库
      - trpg_data:/app/data
    restart: unless-stopped

volumes:
  trpg_data:
