# ============================================================
# SAN 系统集成
# ============================================================

san_effects:
  on_sight:
    trigger: "首次看到神话生物"
    check: "SAN检定(d100 ≤ 当前SAN)"
    on_fail: "损失san_cost的SAN值"
    on_critical_fail: "损失最大值 + 可能触发临时疯狂"

  temporary_insanity:
    triggers:
      - "单次损失SAN ≥ 5"
      - "单日累计损失SAN ≥ 20%当前SAN"
    effects:
      - "flee_blindly"       # 无方向逃跑5轮
      - "freeze"              # 僵直2轮——无法行动
      - "attack_nearest"      # 攻击最近的人——不分敌我
      - "scream_endlessly"    # 持续尖叫——暴露位置

  indefinite_insanity:
    trigger: "SAN降至0或累计损失≥20%最大值"
    effect: "永久精神创伤——角色产生长期恐惧症/偏执/仪式行为"
