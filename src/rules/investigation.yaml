# 复合线索系统 — TRPG 律书集成
# ══════════════════════════════════════
# 核心：一条线索有多种检定方式，每种给出不同的信息层。
# 不是"投历史→成功就全知道"——是多维度拼图。

investigation_system:

  # ══════════════════════════════════════
  # 一、线索的多技能入口
  # ══════════════════════════════════════

  # 每类线索定义多条检定路径
  # 主线检定：最直接的技能，给核心线索
  # 辅助检定：相关的技能，给补充线索 + 降低主线难度
  # 如果缺辅助检定 → 主线惩罚
  #
  # CoC 7e 专属字段：
  #   coc_primary/coc_secondary: skill 对应 CoC 标准技能名
  #   san_cost: 调查该线索触发的 SAN 损失格式 "成功SAN/失败SAN"
  #   scene: 该线索关联的场景名

  clue_types:

    antique_object:    # 古董/文物
      description: "一个青铜小雕像，表面有绿色铜锈，造型扭曲不可名状"
      scene: "地下室"
      primary:
        skill: history
        success: "你认出这是公元前4世纪希腊-巴克特里亚风格的文物——但细节不对。这个雕像本该是宙斯或阿波罗，但它不是任何已知的神祇。"
        critical: "风格是公元前4世纪的，但铜锈的化学成分显示它只有200年——而且是人工做旧的。有人特意仿造了一件'古代文物'。"
        fail: "这看起来像是一件旧东西。仅此而已。"
      secondary:
        - skill: art
          effect: "你注意到雕像的解剖学比例——不是人类艺术家会犯的错误。它准确地再现了某种非人的结构。美术史+10% or 奖励骰。"
        - skill: appraise
          effect: "这件东西的工艺精度远超同类文物——铸造缝隙小于0.2毫米。要么是失传的技术，要么根本不是你认知的任何文明做的。它没有市场价——因为没有可比物。"
        - skill: occult
          effect: "希腊-巴克特里亚地区没有这种神祇崇拜——但这东西的造型和你曾在《无名祭祀书》插图中看到的图案吻合。主线难度-10%。"
        - skill: chemistry
          effect: "你刮下了一点铜锈样本。初步测试——不是天然氧化。含有硫化物和微量陨铁。这东西要么埋在地下两千年，要么是在极高温度下人为做旧的。主线获得额外化学证据。"
      combined_threshold:
        three_skills: "你的知识面覆盖了这件文物的全部角度。它是一件精密的伪造品——用200年前的冶金技术仿造2000年前的宗教偶像。动机不可能是钱——这是信仰。"
      # CoC 7e
      coc_primary:
        skill: occult
        regular: "这个雕像的风格看起来不对——比例不是人类能雕刻出来的。你联想到某些禁忌典籍中的插图。"
        hard: "你认出雕像底座的符号——与《死灵书》中记载的旧日支配者崇拜符号一致。这是一个仪式用的偶像。"
        extreme: "铜锈的成分异常——含有陨铁和硫化物，只有不到200年的历史。但风格模仿的是公元前4世纪。这是一件精密的伪造品。"
        critical: "一切拼图归位：非人比例 + 200年做旧 + 旧神符号。有人精心伪造了一件'古代遗物'作为仪式焦点。动机不是金钱——是信仰。"
        fail: "一个旧青铜雕像，看不出什么特别的。"
      coc_secondary:
        - skill: spot_hidden
        - skill: library_use
      san_cost: "0/1d3"

    corpse_clue:       # 尸体线索
      description: "尸体俯卧在书桌前，右手还握着一支钢笔。面部表情扭曲——不是痛苦，是狂喜。"
      scene: "书房"
      primary:
        skill: medicine
        success: "死亡时间约4-6小时前。没有外伤。瞳孔异常放大——不是药物，是某种神经系统反应。笔尖在纸上划了最后一道——他正在写什么。"
        critical: "颈动脉周围的组织呈现出奇特的颜色变化——不是中毒，不是缺氧。你从未在任何医学文献中见过这种症状。他死前经历了极强的精神冲击——'狂喜'不是修辞。"
        fail: "看起来像是心脏病发作。"
      secondary:
        - skill: spot_hidden
          effect: "桌上的墨水瓶倒了一——但地上没有墨水痕迹。有人清理过。而且死者的左手掌心有一条很细的灼痕——像被烫过，但没有水泡。主线提供额外细节。"
        - skill: psychology
          effect: "狂喜的表情 + 挥笔的动作——他死前不是在看什么东西，是在'回应'什么东西。而且是自愿的。奖励骰。"
        - skill: science_chemistry
          effect: "空气中有微弱的臭氧味。不是墨水——是放电。某种电能/静电事件发生在他死亡的同时。"
        - skill: occult
          effect: "这个死亡姿势——右手执笔、面向书桌——和《死灵书》中提到的一种'自动书写'仪式完全一致。他不是在'记录'——他是在'接收'。主线难度-15%。"
      combined_threshold:
        three_skills: "拼图完整了。他参与了某种自动书写仪式——连接了一个非人实体。连接成功时身体承受了静电冲击和极端的精神刺激。他自愿的。清理墨迹的人想掩盖仪式痕迹。"
      # CoC 7e
      coc_primary:
        skill: medicine
        regular: "死亡时间约4-6小时前。没有外伤。瞳孔异常放大——不是药物，是神经系统反应。"
        hard: "左手掌心有电灼痕——而且是在死后形成的。死者的面部肌肉僵硬度不均——右脸比左脸更僵硬，说明死前右半脑经历了极强的神经活动。"
        extreme: "这不是普通的死亡。瞳孔放大、电灼痕、右脑过度活跃——符合文献中描述的'与超自然实体建立精神连接'的生理特征。他是被一瞬间的精神反馈杀死的。"
        critical: "死因完全明确：他主动参与了与异界实体的精神连接，连接建立时承受了超出人类神经极限的信息流。他的大脑在接收最后一条信息时'烧毁'了。"
        fail: "看起来像是心脏病发作。但你不确定。"
      coc_secondary:
        - skill: spot_hidden
        - skill: psychology
      san_cost: "1/1d4"

    document:           # 文献/手稿
      description: "一本手写日记。纸张发黄，墨水褪色。最后几页的字迹越来越潦草。"
      scene: "书房"
      primary:
        skill: library_use
        success: "你能确定这本日记的时间跨度——约6个月。前半部分字迹工整，后半部分逐渐潦草。最后3页的墨水颜色不同——他换过笔。或者有人添加了内容。"
        critical: "最后几页的笔迹与前半部分不是同一个人——模仿得很像，但'g'的写法不同。这三天里写日记的不是原主。"
      secondary:
        - skill: psychology
          effect: "前半部分的书写节奏——焦虑但可控。后半部分——不是焦虑，是恐惧。某些段落旁边有反复涂改的痕迹。他在否认自己写下的东西。"
        - skill: education
          effect: "日记中引用了至少3本你不认识的书的书名。但引文格式非常专业——作者受过正规学术训练。哈佛或密大的水平。奖励骰。"
        - skill: science_chemistry
          effect: "后面几页的墨迹成分不同——铁含量更高。可能是不同的笔——也可能是墨水暴露在空气中的时间不同。主线提供时间线修正。"
        - skill: occult
          effect: "第47页的空白处有一行极小的注释——用的是拉丁文，引用《死灵书》第751页。换成其他学科不会看到这个。主线难度归零。"
      combined_threshold:
        three_skills: "这不是一个人的日记。后半部分——至少最后3天——是另一个人写的。原主可能在写完第47页后'被替代'了。引文格式、笔迹特征、隐藏的《死灵书》引用——三条独立的线索汇聚在同一天。"
      # CoC 7e
      coc_primary:
        skill: library_use
        regular: "日记时间跨度约6个月。后半部分字迹明显变化——写作者在恐惧中记录。引用了一些你认不出的书籍。"
        hard: "最后3页的笔迹与前半部分不是同一个人——'g'和't'的写法不同。有人替代了原主在写日记。第47页有隐藏的《死灵书》引用。"
        extreme: "不止是替代——字迹的变化是渐进的。从第40页开始，笔迹逐渐转移。不是换了人，是原主在被慢慢'覆盖'。这个日记记录了一个人逐渐被非人实体取代的过程。"
        critical: "完整图景：日记从第40页开始出现非人视角。作者不再使用第一人称。他在被占据的过程中一直在抵抗——涂改、圈出、否认——直到第47页，抵抗停止。后面是'它'在写。"
        fail: "一本旧日记，字迹越来越潦草。"
      coc_secondary:
        - skill: occult
        - skill: psychology
      san_cost: "0/1d3"

    ritual_site:        # 仪式现场
      description: "地下室。地面用粉笔画出复杂的几何图案。中央是一个铁盆，里面是干涸的深色液体。空气中有焚香的气味。"
      scene: "地下室"
      primary:
        skill: occult
        success: "粉笔图案不是随意的——它精确地遵循了《死灵书》第751页的'召唤之门'设计。中央的七芒星位置对应Yog-Sothoth。这不是初学者——每个角度都是对的。"
        critical: "右下角的符号被修改过——原符号是'保护'，被改成了'约束'。施法者不是要召唤什么东西——是要把什么东西关回去。而且你知道——这个修改是错的。"
      secondary:
        - skill: spot_hidden
          effect: "粉笔线下还有更早的粉笔线——被擦掉了。两次仪式。第一次的符号和第二次不完全一样。施法者在试错。"
        - skill: science_chemistry
          effect: "铁盆里的液体——不是血。铁含量比人血高得多。含有铜和锌的痕迹。某种工业废料？还是……不是人类的血。主线提供额外信息。"
        - skill: history
          effect: "这种仪式布置与公元前4世纪希腊-巴克特里亚的'门'崇拜完全吻合。但那个崇拜在公元后不久就消失了。至少——官方记录如此。奖励骰。"
      combined_threshold:
        three_skills: "两次仪式。第一次是召唤——用某种非人血液。第二次是试图弥补——把召唤改成约束。但符号改错了。那东西没被关回去。它被放出来了。"
      # CoC 7e
      coc_primary:
        skill: occult
        regular: "这是《死灵书》第751页记载的'召唤之门'仪式。施法者知道自己在做什么——每个比例都是精确的。"
        hard: "粉笔线被画了两次——一层被擦掉的旧线，一层新线。两个版本的符号不同。施法者修改了仪式——但方向不对。他不是要召唤，是要把什么东西关回去。"
        extreme: "铁盆里的液体不是血——是某种非人生物的体液，含有极高的铁和铜含量。这种东西的存在意味着'门'的另一边不是精神层面的——是物理层面的联通。"
        critical: "完整图景：这是一个失败的'关门'仪式。某人——或某物——通过第一次召唤来到了这个世界。第二次仪式试图把它送回去，但符号改错了。它还在。它在这个房子里。"
        fail: "粉笔图案。铁盆。看起来像某种仪式——但你认不出具体的。"
      coc_secondary:
        - skill: spot_hidden
        - skill: chemistry
      san_cost: "1/1d6"

    conversation:        # 对话/社交
      description: "你坐在特里坎夫人的客厅里。她给你倒了茶，手在微微颤抖。'我不明白——警察说他们找不到任何线索。他已经失踪半个月了。'"
      scene: "客厅"
      primary:
        skill: psychology
        success: "她的手在说一件事——焦虑。但她的眼睛在说另一件事——频繁瞄向走廊尽头的房间。她隐瞒了什么。"
      secondary:
        - skill: spot_hidden
          effect: "走廊尽头的门上有一个新装的锁。而且是反锁的——锁在走廊这一侧。她不是怕外面的人进去，是怕里面的东西出来。"
        - skill: persuade
          effect: "你换了个坐姿，用更温和的语气说'夫人，我们是来帮您的。您是否有些事情不方便告诉警察？'她的肩膀松了。奖励骰。"
        - skill: education
          effect: "你注意到她书架上有一本《儿童心理学导论》——折角在第3章'分离焦虑'。她有一个小女儿，而且女儿最近很不安。"
        - skill: occult
          effect: "她泡茶用的水——有微弱的硫磺味。不是水管的问题。你上次闻到这个味道是在那个地下室——那个举行过仪式的地方。"

  # ══════════════════════════════════════
  # 二、难度修正规则
  # ══════════════════════════════════════

  difficulty_modifiers:
    # 辅助检定的效果分为三档
    synergy:
      one_secondary:    "拥有1项辅助技能 → 主线-10% 或 GM酌情给额外描述"
      two_secondary:    "拥有2项辅助技能 → 主线-20% 或 奖励骰(投两次取优)"
      three_secondary:  "拥有3+项辅助技能 → 自动揭示'combined_threshold'的全部信息(不投骰)"
    
    penalty:
      no_secondary:     "正常检定，无修正"
      wrong_approach:   "用完全不相关的技能(如用'医学'检查'文献') → 惩罚骰(投两次取劣)"
      lack_of_education: "EDU < 8 且线索涉及学术知识 → -20%"

    bonus:
      background_match: "线索与调查员背景相符(如退伍军医检查战场伤口) → +15% or 奖励骰"
      previous_exposure: "调查员曾在之前的模组中接触过类似线索 → +10%"
      tool_assist: "使用专业工具(如放大镜/化学试纸) → +10%"

  # ══════════════════════════════════════
  # 三、信息分层——不是"成功/失败"，是"哪一层"
  # ══════════════════════════════════════

  information_layers:
    # 每条线索的信息分成三层
    # 检定成功度决定能看到第几层
    # 辅助技能可以追加额外层

    layer_1_obvious:    # 所有人都能看到
      trigger: "不需要检定——只要调查员声明'我看看这个'"
      example: "一个小雕像。大概20厘米高。青铜的。有铜锈。"
    
    layer_2_observable:  # 技能检定成功
      trigger: "主线技能检定成功(常规)"
      example: "你认出这是公元前4世纪的希腊-巴克特里亚风格文物。"

    layer_3_expert:      # 困难成功 or 辅助技能解锁
      trigger: "主线困难成功 OR 辅助技能检定成功"
      example: "但细节不对——解剖学比例不是人类艺术家会犯的错误。"

    layer_4_hidden:      # 极难成功 or 多辅助组合
      trigger: "主线极难成功 OR 2+辅助技能"
      example: "它不是古代文物。它是200年前做的仿品。而且仿造者知道他在仿造什么。"

    layer_5_profound:    # 大成功 or 3+辅助
      trigger: "主线大成功 OR combined_threshold(3辅助)"
      example: "这从来就不是为了卖钱。它是一个信徒的'圣物'——用古代模版制作的现代崇拜物。制造者还活着。"

  # ══════════════════════════════════════
  # 四、负面修正——缺乏相关知识
  # ══════════════════════════════════════

  knowledge_gaps:
    # 不是所有知识缺失都导致惩罚——取决于线索类型
    missing_art:
      on_antique: "你看得出是件'老东西'，但说不出具体的风格或时代——缺少美术训练。精度降1级。"
      on_corpse: "不相关——对尸体检定无影响"
    
    missing_occult:
      on_ritual: "你看到粉笔图案，但无法理解其意义——缺少神秘学知识。惩罚骰。"
      on_document: "你可能漏掉隐藏在注释中的《死灵书》引用。"
    
    missing_education:
      on_document: "引文格式对你毫无意义——你看不出它与学术论文的区别。主线-15%。"
      on_any: "EDU过低时，检定前GM可以暗示'这超出你的知识范围'"

  # ══════════════════════════════════════
  # 五、KP/引擎裁决规则
  # ══════════════════════════════════════

  # ══════════════════════════════════════
  # 六、技能边界——每种技能到底能分析什么
  # ══════════════════════════════════════

  skill_boundaries:
    # 避免"估价能测陨铁"这类越界
    # 每技能的边界由日常使用场景决定

    appraise:             # 估价
      detects: [市场价值, 流通记录, 稀有度, 工艺精度, 年代磨损, 真伪风格比对]
      cannot: [化学成分, 物理性质, 年代测定(需要化学/物理), 文字翻译]
      boundary: "估价是市场知识，不是实验室分析。'工艺精度远超同类'是估价能说的——但为什么这么精确，需要化学/物理来测。"

    art:                  # 艺术/美术
      detects: [风格流派, 技法识别, 解剖比例, 色彩分析, 透视法, 署名/印章, 赝品风格判断]
      cannot: [化学成分, 文字内容解释, 市场价值(转估价)]
      boundary: "'这不像人类画的'是艺术判断。'颜料含镉，200年前不存在这种颜料'是化学分析。"

    history:              # 历史
      detects: [时代判定, 事件背景, 文化脉络, 已知文物比对, 文献出处, 历史人物, 领土变迁]
      cannot: [物理/化学分析, 语言翻译(需要专门语言技能), 魔法/神秘学解释]
      boundary: "历史告诉你这是什么时期的。但如果这个时期的东西不该出现在这里——那是考古/神秘学的问题。"

    occult:               # 神秘学
      detects: [仪式识别, 符号含义, 典籍引用, 神话实体对应, 魔法理论, 教团/崇拜历史]
      cannot: [科学分析, 法术施放(需要POW+CM), 物理防御]
      boundary: "神秘学告诉你这东西与《死灵书》第751页有关。但它不能告诉你这东西的物理成分。"

    chemistry:            # 化学
      detects: [元素分析, 化合物鉴定, 年代测定(碳14/热释光), 毒物分析, 材料来源, 氧化程度]
      cannot: [艺术风格, 历史背景, 市场价值, 神秘学意义]
      boundary: "化学告诉你这东西含70%铜+30%陨铁。但它不能告诉你这东西是哪个世纪、哪个文明做的。"

    medicine:             # 医学
      detects: [死因, 死亡时间, 伤口类型, 毒物症状, 疾病诊断, 解剖异常, 生命力状态]
      cannot: [犯罪动机, 物品鉴定, 文字解读, 超自然现象解释(除非法医有神话经验)]
      boundary: "'气管被锐器切开'是医学。'凶手身高大约180cm，右手持刀'需要法医学+物理推理，不是纯医学。"

    psychology:           # 心理学
      detects: [情绪状态, 谎言识别, 动机推断, 精神异常, 行为模式, 创伤反应]
      cannot: [事实真相(只是推断), 物理证据, 超自然现象证实]
      boundary: "'她说这句话时在说谎'是心理学推断——但不是事实证据。需要实物证据来确认。"

    spot_hidden:          # 侦查
      detects: [隐藏物品, 痕迹, 异常细节, 手脚痕迹, 隐藏隔间, 伪装]
      cannot: [物品鉴定, 文字解读, 意义判断]
      boundary: "'抽屉底部有一个暗格'是侦查。'暗格里的东西是公元前4世纪的祭祀用品'——这需要历史/神秘学。"
    declare_approach: |
      玩家必须声明"我怎么检查"。不是"我投历史"——是"我把它翻过来看底部有没有铭文"。
      如果描述的操作匹配多个技能 → 按最高相关度选主线。
    
    primary_skill_selection: |
      如果玩家描述了一个操作跨多个技能（如"我用医学知识检查这个伤口，
      同时注意有没有非人的特征"）→ 选主线(医学)，辅助(神秘学)自动应用。
    
    when_to_give_combined: |
      如果调查员在 RP 中展示了对线索的深层理解（而不是投骰），
      直接给 combined_threshold 的效果。"你发现这东西不对劲——不是钱的问题，是信仰的问题。"
    
    progressive_reveal: |
      不要一次全给。按层给，给调查员时间思考和讨论。
      每给一层信息后暂停——"你还想进一步检查吗？"
       有些层需要调查员主动声明（如"我用化学试纸测试那个液体"）→ 才触发辅助检定。

  # ══════════════════════════════════════
  # 七、主动/被动技能效果阈值
  # ══════════════════════════════════════

  passive_active_system:
    thresholds:
      untrained:    "技能 <10%  → 不触发任何被动。"
      novice:       "技能 10-29% → 被动: 模糊直觉。"
      competent:    "技能 30-49% → 被动: 自动注意到明显异常。"
      expert:       "技能 50-69% → 被动: 自动给出1条低层线索。"
      master:       "技能 70-89% → 被动: 自动给出2条(1低+1中)。"
      legendary:    "技能 90%+  → 被动: 全景扫描。主动: 极难成功直达隐藏层。"

    medicine:
      passive:
        30: "'伤口不是意外——切割方向说明是故意的。'"
        50: "'死亡不超过6小时——尸僵还没完全形成。'"
        70: "'嘴唇的紫色不是窒息——是神经性毒素。'"
        90: "'瞳孔的异常放大不是药物——这不是人能承受的东西。'"

    history:
      passive:
        30: "'这不像是现代制造的。'"
        50: "'风格是希腊的——但不是熟知的任何时期。'"
        70: "'不是公元前4世纪。是17-18世纪的仿品——仿造者知道他在仿什么。'"
        90: "'你见过类似的——《无名祭祀书》插图。不是希腊。是更古老的。'"

    occult:
      passive:
        30: "'这图案——某本书的插图中见过。不是好兆头。'"
        50: "'粉笔线的走向——这是召唤阵。施法者知道他在干什么。'"
        70: "'右下角的符号被改过——原符号是防护，被改成了约束。但改错了。'"
        90: "'Yog-Sothoth。不是召唤——是门。他在尝试开一扇门。'"

    spot_hidden:
      passive:
        30: "'墙角的灰尘分布不均匀——有人移动过那里的东西。'"
        50: "'地毯边缘翘起来了——底下有东西。'"
        70: "'书架上第三排——那些不是书，是笔记本。'"
        90: "引擎自动标记场景中所有非明显线索位置。"

    psychology:
      passive:
        30: "'她在回避某个话题。'"
        50: "'提到儿子时用的是过去式——她潜意识里认为他已经不在了。'"
        70: "'不是焦虑——是内疚。她做了什么。或没做什么。'"
        90: "'她的每一个微表情都在说：她知道得比说出来的多得多。怕的不是坏人，是真相。'"

    # 主动声明 → 检定
    # 被动给方向("墙角的灰尘不对") → 玩家选择深入("我去看那个角落") → 触发主动检定
    # 被动只给低层——细节层必须主动检定解锁
    # 2+技能均达被动阈值 → GM给交叉洞察

    # 队友传递：如果队中有人被动触发并主动告知 → 其他人临时获得该线索
    teammate_relay:
      rule: "高技能队友的被动发现 → 告知队友 → 队友获得同一条表层线索（不投骰）。但细节层仍需要队友自己的技能来深挖。"
      example: "老兵说'小心，这里有陷阱' → 新手知道了有陷阱 → 可以主动投侦查来找(正常难度)。但如果老兵没说——新手踩上去之前都不知道。"

  # ══════════════════════════════════════
  # 八、硬线索保障——不能全靠检定
  # ══════════════════════════════════════

  hard_clue_guarantee:
    # 问题：如果全队投不出医学，气管切开的线索就丢了？
    # 答：不。关键线索分三类处理。

    # --- 三类线索 ---
    clue_tiers:
      mandatory:     # 硬线索——不需要检定，肉眼可见
        rule: "推进主线必须的线索，直接给。不投骰。"
        barn_examples:
          - "谷仓里有8张床，上面躺着人"        # 直接描述
          - "中控室的门开着，有灯光"             # 视觉引导
          - "下水道深处传来婴儿啼哭"            # 听觉引导
          - "尸体的大脑被环切，头骨一分为二"    # 极端视觉——不可能无视
      
      skill_revealed: # 技能线索——检定揭示，但有替补路径
        rule: "检定成功→直接获得。检定失败→不卡关，但有代价。"
        barn_examples:
          trachea: |
            "气管被切开" → 医学检定
            成功: "死因是血液入肺窒息。伤口角度显示正面割入——不是自杀。"
            失败: "你看到脖子上有伤口，但无法判断死因。" 
                 → 替补路径: 如果调查员试图"救助"受害者并打开仪器
                 → 自动发现气管被切开(不投骰) + 受害者可能死亡
                 → 代价: 一个受害者死了 + 愧疚(SAN扣)
          traps: |
            "农场有陷阱" → 侦查/军事背景
            成功: 逐个发现，安全通过。
            失败: 踩中 → 受伤，但自动知道"有陷阱"了(不投骰)
                 → 代价: 伤害 + 治疗消耗
      
      bonus:         # 奖励线索——检定成功给，失败不卡关
        rule: "检定成功→额外信息/捷径。失败→无损失，只是错过。"
        barn_examples:
          - '屋顶有入口可绕过防盗门 → 侦查成功→捷径。失败→走正门。'
          - '中控室可更换氧气瓶 → 医学成功→买时间。失败→自然推进。'

    # --- 补救机制: 失败后重试的代价 ---
    retry_cost:
      rule: "同一检定不能无限重试——每次重试必须有新条件。"
      conditions:
        - "用了新工具(如手电筒→重试侦查)"
        - "换了新角度(如趴下看→重试侦查)"
        - "花了新时间(如多花10分钟→重试医学)但疲劳惩罚"
        - "队友协助 → 用队友技能重试"
      cannot:
        - "'我再投一次'——不许"

    # --- 技能覆盖的团队保障 ---
    party_coverage:
      rule: "选人/车卡时GM应提示：至少一人有医学(>30%)，至少一人有侦查(>50%)。如果不满足——给NPC队友或降低主线难度。"
      barn_recommendation: "推荐 1医学 + 1侦查 + 1战斗/社交"

